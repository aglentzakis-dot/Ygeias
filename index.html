<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Φάκελος Υγείας</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Υγεία">
<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#17201e;--mut:#5f6b68;--line:#dde4e2;--pri:#0f766e;--onpri:#fff;--pri2:#dff2ee;--head:#0f766e;--red:#c62828;--redbg:#fdecea;--orange:#d9700f;--yellow:#b58f00;--green:#2e7d32;--blue:#1565c0;--sh:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1312;--card:#192120;--tx:#e7eeec;--mut:#9aa8a4;--line:#2b3533;--pri:#2dd4bf;--onpri:#05201d;--pri2:#11342f;--head:#0b4f49;--red:#ef5350;--redbg:#3a1b1b;--orange:#f39c4a;--yellow:#e6c229;--green:#66bb6a;--blue:#64b5f6;--sh:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:19px;margin:0}
header button{white-space:nowrap;flex:none}
header small{opacity:.85;font-size:13px}
main{max-width:720px;margin:0 auto;padding:12px 14px}
section.tab{display:none}section.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--sh)}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:15px;margin:12px 0 6px}
.mut{color:var(--mut);font-size:14px}
.big{font-size:30px;font-weight:700;line-height:1.1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 13px;cursor:pointer;min-height:42px}
button.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:600}
button.ok{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
button.danger{color:var(--red);border-color:var(--red)}
button.small{min-height:34px;padding:5px 10px;font-size:14px}
button.wide{width:100%}
button:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;background:var(--card);min-height:34px}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:13px;background:var(--pri2);color:var(--tx);margin:2px 4px 2px 0}
.dose{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.dose:first-of-type{border-top:0}
.dose .t{font-weight:700;font-size:18px;min-width:56px}
.dose.late .t{color:var(--red)}
.dose.done{opacity:.65}
.st{font-size:14px;font-weight:600}
.warn{background:var(--redbg);border-color:var(--red)}
.pill{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 5px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:7px 2px 6px;min-height:62px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--pri);font-weight:700}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,96vw);max-height:92vh;background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px}
dialog h2{margin:0 0 12px;font-size:19px}
label{display:block;font-size:14px;color:var(--mut);margin:0 0 10px}
input,select,textarea{display:block;width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:8px 10px}
legend{font-size:14px;color:var(--mut);padding:0 4px}
.ck{display:inline-flex;align-items:center;gap:5px;margin:4px 10px 4px 0;color:var(--tx);font-size:15px}
.ck input{width:auto;min-height:0;margin:0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.times{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.times .row input{flex:1;margin:0}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#banner{display:none;position:sticky;top:0;z-index:4;background:var(--orange);color:#fff;padding:10px 14px;font-weight:600}
.hcard{font-size:16px}
.hcard.bigtxt{font-size:21px}
.hcard .lbl{color:var(--mut);font-size:.8em;margin-top:8px}
.hcard .al{color:var(--red);font-weight:700}
.hcard table{font-size:1em}
svg text{fill:var(--mut);font-size:10px}
.bpv{font-weight:700}
.q{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;min-height:0;padding:0;border-radius:50%;border:1.5px solid var(--pri);color:var(--pri);background:transparent;font-size:13px;font-weight:700;cursor:pointer;vertical-align:middle;margin-left:6px;flex:none;line-height:1}
.edf{cursor:pointer;border-radius:8px;padding:2px 4px;margin:0 -4px}
.edf:active{background:var(--pri2)}
.edf .pen{float:right;color:var(--pri);font-size:.85em}
.ph{color:var(--mut);font-style:italic;font-size:.9em}
.meter{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--blue) 0 15%,var(--green) 15% 55%,var(--yellow) 55% 70%,var(--orange) 70% 85%,var(--red) 85%);margin:8px 0 2px}
.meter i{position:absolute;top:-4px;width:4px;height:18px;background:var(--tx);border-radius:2px;transform:translateX(-50%)}
.kv{display:grid;grid-template-columns:1fr 1.15fr;gap:4px 12px;font-size:15px}
.kv div:nth-child(odd){color:var(--mut)}
.pchip{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:999px;padding:2px 10px;min-height:26px;font-size:13px;margin-top:4px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);align-items:center;justify-content:center;padding:20px}
.lockbox{width:min(340px,100%);text-align:center;display:flex;flex-direction:column;gap:10px}
#lockpin{text-align:center;font-size:24px;letter-spacing:6px}
.pthumb{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line)}
.mbarw{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.mbar{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.mbar .chip{white-space:nowrap;flex:none}
a.tel{color:var(--pri);font-weight:700;text-decoration:none;white-space:nowrap;margin-left:4px}
.rowset{position:relative}
.bpm{position:relative;margin:12px 0 4px;cursor:pointer;padding-top:4px}
.bpbar{display:flex;height:12px;border-radius:6px;overflow:hidden}
.bpbar span{flex:1}
.bpm i{position:absolute;top:0;width:8px;height:20px;background:var(--tx);border:2px solid var(--card);border-radius:4px;transform:translateX(-50%)}
.bplbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:3px}
.aibox{background:var(--pri2);border-radius:12px;padding:10px;margin-bottom:12px}
details summary{cursor:pointer}
.list-day{margin-top:10px;font-weight:700;font-size:14px;color:var(--mut)}
#print{display:none}
@media print{
 body{background:#fff;color:#000;padding:0}
 #print .noprint,#print .pen,#print .q{display:none!important}
 body.printing>*:not(#print){display:none!important}
 body.printing #print{display:block;padding:10mm;font-size:12pt}
 #print table{font-size:10.5pt}#print th,#print td{border-bottom:1px solid #999;color:#000}
}
</style>
</head>
<body>
<header><div><h1>Φάκελος Υγείας</h1><small id="hdate"></small><div><button id="pbtn" class="pchip" data-act="people">👤</button> <button id="lbtn" class="pchip notr" data-act="lang" aria-label="Γλώσσα">🇬🇷</button></div></div><button class="small" data-act="addbp" style="background:#ffffff22;color:#fff;border-color:#ffffff55">+ Πίεση</button></header>
<div id="banner"></div>
<main>
 <section class="tab on" id="t-sim"></section>
 <section class="tab" id="t-pie"></section>
 <section class="tab" id="t-far"></section>
 <section class="tab" id="t-kar"></section>
 <section class="tab" id="t-per"></section>
</main>
<nav>
 <button data-tab="sim" class="on"><span>🏠</span>Σήμερα</button>
 <button data-tab="pie"><span>❤️</span>Μετρήσεις</button>
 <button data-tab="far"><span>💊</span>Φάρμακα</button>
 <button data-tab="kar"><span>🏥</span>Κάρτα</button>
 <button data-tab="per"><span>☰</span>Περισσότερα</button>
</nav>
<dialog id="dlg"></dialog>
<dialog id="hdlg"></dialog>
<div id="toast"></div>
<div id="print"></div>
<div id="lock" style="display:none"><div class="lockbox"><div style="font-size:52px">🔒</div><h2>Φάκελος Υγείας</h2><input id="lockpin" type="password" inputmode="numeric" autocomplete="off" placeholder="Κωδικός"><button class="pri wide" data-act="unlock">Ξεκλείδωμα</button><button class="wide" id="lockbio" data-act="unlockbio">👆 Δαχτυλικό / πρόσωπο</button><div id="lockmsg" style="color:var(--red);min-height:22px"></div><button class="small" data-act="lockforgot">Ξέχασα τον κωδικό</button></div></div>
<input type="file" id="labIn" accept="image/*" style="display:none">
<input type="file" id="rxIn" accept="image/*" style="display:none">
<input type="file" id="pillIn" accept="image/*" capture="environment" style="display:none">
<input type="file" id="camIn" accept="image/*" capture="environment" style="display:none">
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script src="i18n.js"></script>
<script>
"use strict";
/* ---------- Βασικά ---------- */
const APP_VERSION='1.6.0';
const SUB='Fakelos-Ygeias', PKEY='fakelosYgeias_people';
let PEOPLE=(()=>{try{const x=JSON.parse(localStorage.getItem(PKEY));if(x&&x.list&&x.list.length)return x}catch(e){}return{list:[{id:'p1',key:'fakelosYgeias'}],cur:'p1'}})();
let KEY=(PEOPLE.list.find(p=>p.id===PEOPLE.cur)||PEOPLE.list[0]).key;
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const u=x=>'<span class="notr">'+esc(x)+'</span>';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---------- Γλώσσα (ελληνικά / αγγλικά / βουλγαρικά) ---------- */
const LANGKEY='fakelosYgeias_lang',LANGS=[['el','🇬🇷','Ελληνικά'],['en','🇬🇧','English'],['bg','🇧🇬','Български']];
let LANG=(()=>{try{const l=localStorage.getItem(LANGKEY);return ['el','en','bg'].includes(l)?l:'el'}catch(e){return 'el'}})();
let TRX=null;
function buildTr(){const M=window.I18N||{};const keys=Object.keys(M).filter(k=>M[k]&&M[k][0]!==k).sort((a,b)=>b.length-a.length);if(!keys.length)return;
 const rx=k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');TRX=new RegExp('(?<![\\p{L}])(?:'+keys.map(rx).join('|')+')(?![\\p{L}])','gu')}
const GRK=/[Ͱ-Ͽἀ-῿]/;
function tr(s){if(LANG==='el'||!TRX||s==null)return s;s=String(s);if(!GRK.test(s))return s;const M=window.I18N,i=LANG==='en'?0:1;return s.replace(TRX,m=>(M[m]&&M[m][i])||m)}
function trNode(root){if(LANG==='el'||!TRX||!root)return;
 const doText=t=>{const p=t.parentNode;if(!p||(p.closest&&p.closest('textarea,script,style,.notr')))return;const v=t.data;if(!GRK.test(v))return;const nv=tr(v);if(nv!==v)t.data=nv};
 const doEl=e=>{if(e.tagName==='OPTION'&&!e.hasAttribute('value'))e.setAttribute('value',e.textContent);for(const a of ['placeholder','title','aria-label']){const v=e.getAttribute(a);if(v&&GRK.test(v)){const nv=tr(v);if(nv!==v)e.setAttribute(a,nv)}}};
 if(root.nodeType===3){doText(root);return}if(root.nodeType!==1)return;
 if(root.closest&&root.closest('.notr'))return;doEl(root);
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);while(w.nextNode()){const c=w.currentNode;if(c.nodeType===3)doText(c);else doEl(c)}}
let MO=null;
function startTr(){if(LANG==='el')return;buildTr();if(!TRX)return;
 document.documentElement.lang=LANG;document.title=tr('Φάκελος Υγείας');trNode(document.body);
 MO=new MutationObserver(ms=>{MO.disconnect();for(const m of ms){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)}MO.observe(document.body,{childList:true,subtree:true,characterData:true})});
 MO.observe(document.body,{childList:true,subtree:true,characterData:true});
 const _a=window.alert.bind(window),_c=window.confirm.bind(window),_p=window.prompt.bind(window);
 window.alert=m=>_a(tr(m));window.confirm=m=>_c(tr(m));window.prompt=(m,d)=>_p(tr(m),d);
}
function langDlg(){openDlg(`<h2>🌐 Γλώσσα</h2>${LANGS.map(([k,f,n])=>`<button type="button" class="wide ${LANG===k?'pri':''}" data-act="setlang" data-v="${k}" style="margin-bottom:8px;font-size:18px"><span class="notr">${f} ${n}</span></button>`).join('')}<div class="acts"><button type="button" data-act="close">Κλείσιμο</button></div>`,()=>{})}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;
 if(b.dataset.act==='lang')langDlg();
 if(b.dataset.act==='setlang'){try{localStorage.setItem(LANGKEY,b.dataset.v)}catch(_){}location.reload()}});
const LANG_AI={en:'English',bg:'Bulgarian'};
const MERES=['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
const MERES_S=['Κυ','Δε','Τρ','Τε','Πε','Πα','Σα'];
const MHNES=['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];
const fmtD=d=>d.getDate()+' '+MHNES[d.getMonth()]+' '+d.getFullYear();
const fmtS=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const FOOD={'':'','prin':'πριν το φαγητό','me':'με το φαγητό','meta':'μετά το φαγητό','nistis':'νηστικός','adiaforo':'ανεξάρτητα από φαγητό'};
const FORMS=['δισκίο','κάψουλα','σταγόνες','σιρόπι','φακελάκι','ένεση','εισπνοές','αλοιφή / κρέμα','έμπλαστρο','άλλο'];
const ZONES=[{n:'Πρωί',a:5,b:12,l:'05–12'},{n:'Μεσημέρι',a:12,b:17,l:'12–17'},{n:'Απόγευμα',a:17,b:21,l:'17–21'},{n:'Βράδυ',a:21,b:29,l:'21–05'}];
const zoneOf=d=>{let h=d.getHours();if(h<5)h+=24;return ZONES.find(z=>h>=z.a&&h<z.b)};
const SYMS=['ζάλη','πονοκέφαλος','κούραση','ταχυκαρδία','πόνος στο στήθος','θολή όραση','δύσπνοια'];

function fix(d){d=d||{};d.profile=d.profile||{};d.bp=d.bp||[];d.meds=d.meds||[];d.doses=d.doses||{};d.appts=d.appts||[];d.vitals=d.vitals||[];d.labs=d.labs||[];d.symptoms=d.symptoms||[];d.questions=d.questions||[];d.prev=d.prev||{};d.settings=d.settings||{};d.notified=d.notified||{};if(d.settings.period==null)d.settings.period=30;if(d.settings.sound==null)d.settings.sound=true;return d}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)return fix(x)}catch(e){}return fix({})}
let D=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Αποτυχία αποθήκευσης στη συσκευή')}}
function save(){persist();schedBackup()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}

/* ---------- Κατάταξη πίεσης ---------- */
function bpClass(s,d){
 if(s>=180||d>=110)return{t:'Πολύ υψηλή',c:'var(--red)',warn:'Πολύ υψηλή πίεση. Ξεκουραστείτε 5 λεπτά και ξαναμετρήστε. Αν παραμένει τόσο ψηλά ή έχετε πόνο στο στήθος, δύσπνοια, αδυναμία ή θολή όραση, καλέστε αμέσως το 166 ή τον γιατρό σας.'};
 if(s<90||d<60)return{t:'Χαμηλή',c:'var(--blue)',warn:(s<80?'Πολύ χαμηλή πίεση. Αν έχετε ζάλη ή λιποθυμική τάση, ξαπλώστε και επικοινωνήστε με γιατρό.':'')};
 if(s>=160||d>=100)return{t:'Υψηλή (2ου βαθμού)',c:'var(--red)'};
 if(s>=140||d>=90)return{t:'Υψηλή (1ου βαθμού)',c:'var(--orange)'};
 if(s>=135||d>=85)return{t:'Οριακά υψηλή (για μέτρηση σπιτιού)',c:'var(--yellow)'};
 if(s>=120||d>=80)return{t:'Φυσιολογική',c:'var(--green)'};
 return{t:'Άριστη',c:'var(--green)'};
}
function bpStats(list){
 if(!list.length)return null;
 const av=f=>{const v=list.filter(r=>r[f]);return v.length?Math.round(v.reduce((a,r)=>a+r[f],0)/v.length):null};
 const sys=list.map(r=>r.sys);
 return{n:list.length,sys:av('sys'),dia:av('dia'),pulse:av('pulse'),maxS:Math.max(...sys),minS:Math.min(...sys),
  maxD:Math.max(...list.map(r=>r.dia)),minD:Math.min(...list.map(r=>r.dia)),high:list.filter(r=>r.sys>=135||r.dia>=85).length};
}
function bpInPeriod(){const p=+D.settings.period;const lim=p?Date.now()-p*864e5:0;return D.bp.filter(r=>+new Date(r.t)>=lim).sort((a,b)=>a.t<b.t?1:-1)}

/* ---------- Πρόγραμμα φαρμάκων ---------- */
function scheduledOn(m,date){
 if(!m.active||m.prn)return false;
 const k=dkey(date);
 if(m.start&&k<m.start)return false;
 if(m.until&&k>m.until)return false;
 if(+m.interval>1){const s0=fromKey(m.start||k),d0=fromKey(k),diff=Math.round((d0-s0)/864e5);return diff>=0&&diff%(+m.interval)===0}
 if(m.days&&m.days.length&&m.days.length<7)return m.days.includes(date.getDay());
 return true;
}
function dueList(date){const o=[];D.meds.forEach(m=>{if(scheduledOn(m,date))(m.times||[]).forEach(t=>o.push({med:m,time:t}))});return o.sort((a,b)=>a.time.localeCompare(b.time))}
const doseKey=(date,m,t)=>dkey(date)+'|'+m.id+'|'+t;
function adherence(m,days){
 let due=0,tk=0;const now=new Date(),nm=now.getHours()*60+now.getMinutes();
 for(let i=0;i<days;i++){const d=new Date(now);d.setDate(d.getDate()-i);if(!scheduledOn(m,d))continue;
  (m.times||[]).forEach(t=>{const [h,mi]=t.split(':').map(Number);if(i===0&&h*60+mi>nm)return;due++;const r=D.doses[doseKey(d,m,t)];if(r&&r.s==='taken')tk++})}
 return due?Math.round(tk/due*100):null;
}
function daysLeft(m){
 if(m.stock===''||m.stock==null||m.prn)return null;
 const per=(+m.perDose||1)*((m.times||[]).length||1)*(+m.interval>1?1/(+m.interval):(m.days&&m.days.length&&m.days.length<7)?m.days.length/7:1);
 return per?Math.floor(+m.stock/per):null;
}
function medTitle(m){return esc(m.name)+(m.strength?' <span class="mut">'+esc(m.strength)+'</span>':'')}
function freqText(m){
 if(m.prn)return 'όταν χρειάζεται';
 let s=(m.times||[]).join(', ');
 if(+m.interval>1)s+=' · κάθε '+m.interval+' ημέρες';
 else if(m.days&&m.days.length&&m.days.length<7)s+=' · '+m.days.map(d=>MERES_S[d]).join(' ');
 return s||'χωρίς ώρα';
}
function addHist(m,text){m.history=m.history||[];m.history.push({t:new Date().toISOString(),text})}

function bpChart(list){
 if(list.length<2)return '<p class="mut">Χρειάζονται τουλάχιστον 2 μετρήσεις.</p>';
 const pts=list.slice().sort((a,b)=>a.t<b.t?-1:1),W=340,H=200,L=30,R=8,T=8,B=22;
 const t0=+new Date(pts[0].t),t1=+new Date(pts[pts.length-1].t),span=Math.max(t1-t0,1);
 const ymin=Math.floor(Math.min(50,...pts.map(r=>r.dia-10))/10)*10,ymax=Math.ceil(Math.max(170,...pts.map(r=>r.sys+10))/10)*10;
 const x=t=>L+(t-t0)/span*(W-L-R),y=v=>T+(ymax-v)/(ymax-ymin)*(H-T-B);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Γράφημα πίεσης">`;
 for(let v=ymin;v<=ymax;v+=20)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
 [135,85].forEach(v=>s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--mut)" stroke-dasharray="4 4"/>`);
 [['sys','var(--red)'],['dia','var(--blue)']].forEach(([f,c])=>{
  s+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map(r=>x(+new Date(r.t)).toFixed(1)+','+y(r[f]).toFixed(1)).join(' ')}"/>`;
  if(pts.length<=60)pts.forEach(r=>s+=`<circle cx="${x(+new Date(r.t)).toFixed(1)}" cy="${y(r[f]).toFixed(1)}" r="2.6" fill="${c}"/>`)});
 const d0=new Date(t0),d1=new Date(t1);
 s+=`<text x="${L}" y="${H-5}">${pad(d0.getDate())}/${pad(d0.getMonth()+1)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${pad(d1.getDate())}/${pad(d1.getMonth()+1)}</text></svg>`;
 return s;
}

function cardText(){
 const p=D.profile,act=D.meds.filter(m=>m.active).sort((a,b)=>a.name.localeCompare(b.name,'el')),bi=lastBpInfo(),rs=recentStopped(),L=[];
 L.push('ΚΑΡΤΑ ΥΓΕΙΑΣ — '+(p.name||''));
 if(p.birth)L.push('Γέννηση: '+fmtS(fromKey(p.birth)));if(p.amka)L.push('ΑΜΚΑ: '+p.amka);if(p.blood)L.push('Ομάδα αίματος: '+p.blood);
 L.push('ΑΛΛΕΡΓΙΕΣ: '+(p.allergies||(p.noAllergy?'Καμία γνωστή':'δεν έχει δηλωθεί')));if(p.birth)L.push('Ηλικία: '+ageOf());if(p.weight)L.push('Βάρος: '+p.weight+' κιλά');if(p.conditions)L.push('Παθήσεις: '+p.conditions);
 L.push('','ΕΝΕΡΓΑ ΦΑΡΜΑΚΑ ('+fmtS(new Date())+'):');
 act.forEach((m,i)=>L.push((i+1)+'. '+m.name+(m.strength?' '+m.strength:'')+(m.dose?' — '+m.dose:'')+' — '+freqText(m)+(m.food?' ('+FOOD[m.food]+')':'')+(m.purpose?' — για: '+m.purpose:'')));
 if(!act.length)L.push('Κανένα');
 if(rs.length){L.push('','Διακοπή τελευταίων 3 μηνών:');rs.forEach(m=>L.push('- '+m.name+(m.strength?' '+m.strength:'')+' ('+fmtS(fromKey(m.end))+(m.endReason?', '+m.endReason:'')+')'))}
 if(bi)L.push('','Πίεση: τελευταία '+bi.last.sys+'/'+bi.last.dia+' ('+fmtS(new Date(bi.last.t))+')'+(bi.w?', Μ.Ο. 7 ημερών '+bi.w.sys+'/'+bi.w.dia:''));
 if(contactsOf().length)L.push('Επαφές έκτακτης ανάγκης: '+contactsText());if(doctorsOf().length)L.push('Γιατροί: '+doctorsText());if(p.other)L.push('Άλλα: '+p.other);
 return L.join('\n');
}

function openDlg(html,onOk){
 if(typeof LOCKED!=='undefined'&&LOCKED)return;
 const d=$('#dlg');d.innerHTML='<form id="dform" novalidate>'+html+'</form>';
 const f=$('#dform');
 f.onsubmit=e=>{e.preventDefault();if(!f.reportValidity())return;if(onOk(new FormData(f),f)!==false)d.close()};
 d.showModal();
}

function bpForm(r){

 <div class="g2"><label>Χέρι ${hq('arm')}<select name="arm">${['','αριστερό','δεξί'].map(v=>`<option ${r.arm===v?'selected':''} value="${v}">${v||'—'}</option>`).join('')}</select></label><label>Θέση<select name="pos">${['','καθιστός','ξαπλωμένος','όρθιος'].map(v=>`<option ${r.pos===v?'selected':''} value="${v}">${v||'—'}</option>`).join('')}</select></label></div>
 <fieldset><legend>Συμπτώματα</legend>${SYMS.map(s=>`<label class="ck"><input type="checkbox" name="sym" value="${s}" ${(r.sym||[]).includes(s)?'checked':''}>${s}</label>`).join('')}</fieldset>
 <label>Σημείωση<textarea name="note" placeholder="π.χ. πριν το πρωινό χάπι, μετά από περπάτημα">${esc(r.note||'')}</textarea></label>
 ${btns(r.id?`<button type="button" class="danger" data-act="delbp" data-id="${r.id}" style="margin-right:auto">Διαγραφή</button>`:'')}`,
 fd=>{
  const sys=+fd.get('sys'),dia=+fd.get('dia');
  if(dia>=sys){alert('Η μικρή πίεση πρέπει να είναι μικρότερη από τη μεγάλη.');return false}
  const [y,mo,da]=fd.get('d').split('-').map(Number),[hh,mi]=fd.get('h').split(':').map(Number);
  const o={id:r.id||uid(),t:new Date(y,mo-1,da,hh,mi).toISOString(),sys,dia,pulse:+fd.get('pulse')||null,arm:fd.get('arm'),pos:fd.get('pos'),sym:fd.getAll('sym'),note:fd.get('note').trim()};
  const i=D.bp.findIndex(x=>x.id===o.id);if(i>=0)D.bp[i]=o;else D.bp.push(o);
  save();render();const c=bpClass(sys,dia);
  if(c.warn)setTimeout(()=>alert(c.warn),200);else toast('Αποθηκεύτηκε · '+c.t);
 });
}

 // ίδιο κλειδί με άλλες εφαρμογές του ίδιου ιστότοπου (π.χ. Identify-AI)

async function freeModels(force){

 const j=await r.json();

async function aiCall(content,models){
 let last='';
 if(LANG!=='el'&&LANG_AI[LANG]){let done=false;content=content.map(c=>{if(!done&&c.type==='text'){done=true;return Object.assign({},c,{text:c.text+'\n\nIMPORTANT: write every human-readable text value in '+LANG_AI[LANG]+' (keep JSON keys and code values such as prin/me/meta/ok/minor unchanged).'})}return c})}
 for(const model of models){
  try{
   const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+getKey(),'Content-Type':'application/json','X-Title':'Fakelos Ygeias'},
    body:JSON.stringify({model,messages:[{role:'user',content}],temperature:0.2,max_tokens:1500})});
   const j=await r.json().catch(()=>({}));
   if(r.status===401)throw Object.assign(new Error('Το κλειδί δεν είναι σωστό'),{fatal:true});
   if(!r.ok||j.error){last=(j.error&&j.error.message)||('σφάλμα '+r.status);continue}
   const txt=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
   const t=Array.isArray(txt)?txt.map(x=>x.text||'').join(''):txt;
   const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a){last='ακατάλληλη απάντηση';continue}
   return JSON.parse(t.slice(a,b+1));
  }catch(e){if(e.fatal)throw e;last=e.message}
 }
 throw new Error('Δεν απάντησε κανένα δωρεάν μοντέλο ('+last+'). Δοκιμάστε ξανά σε λίγο.');
}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const M=1400,k=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.85))};img.onerror=()=>rej(new Error('Η φωτογραφία δεν διαβάστηκε'));img.src=u})}
const AI_PROMPT=`Είσαι βοηθός φαρμακοποιού. ΣΤΟΧΟΣ: αναγνώρισε το φάρμακο ΚΑΙ δώσε πληροφορίες στα ελληνικά, απλά για ασθενή.

async function aiRun(file,name){
 const st=$('#aistat'),btns=document.querySelectorAll('[data-act=aiphoto],[data-act=ainame]');
 const set=t=>{if(st)st.innerHTML=t};btns.forEach(b=>b.disabled=true);
 try{
  set('⏳ Ετοιμασία…');const content=[{type:'text',text:AI_PROMPT+(name?'\nΤο φάρμακο είναι: '+name:'\nΔες τη φωτογραφία της συσκευασίας.')}];
  if(file){const url=await shrink(file);content.push({type:'image_url',image_url:{url}});try{const f0=$('#dform');if(f0&&f0.elements.photo&&!f0.elements.photo.value){const tu=await thumb(file,260,0.7);f0.elements.photo.value=tu;const pv=$('#pillpv');if(pv){pv.src=tu;pv.style.display='block'}}}catch(_){}}
  const models=await freeModels(false);
  set('⏳ Η τεχνητή νοημοσύνη αναζητά το φάρμακο…');
  let r;try{r=await aiCall(content,models.slice(0,6))}catch(e){if(e.fatal)throw e;r=await aiCall(content,(await freeModels(true)).slice(0,6))}
  if(!r||(!r.name&&!r.substance)){set('✕ Δεν αναγνωρίστηκε. Τραβήξτε πιο καθαρά την πλευρά με το όνομα, με καλό φως.');return}
  const f=$('#dform');if(!f)return;
  const put=(n,v)=>{if(v&&f.elements[n])f.elements[n].value=String(v).trim()};
  put('name',r.name||name);put('strength',r.strength);put('substance',r.substance);put('purpose',r.purpose);put('sideEffects',r.sideEffects);put('warnings',r.warnings);
  if(r.form&&FORMS.includes(r.form))f.elements.form.value=r.form;
  if(r.food&&FOOD[r.food]!==undefined&&r.food)f.elements.food.value=r.food;
  f.elements.ai.value='1';
  set(`✓ Συμπληρώθηκε${r.confidence?' (βεβαιότητα: '+esc(r.confidence)+')':''}. <b>Ελέγξτε τα στοιχεία</b> και βάλτε ώρες και δόση όπως σας τα έγραψε ο γιατρός.`);
 }catch(e){set('✕ '+esc(e.message))}
 finally{btns.forEach(b=>b.disabled=false)}
}

/* ---------- Εκδόσεις & αυτόματη αναβάθμιση ---------- */
const vcmp=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};
let REMOTE=null;
async function fetchRemote(){const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('σφάλμα '+r.status);return r.json()}
async function applyUpdate(v){
 try{sessionStorage.setItem('updTried',v)}catch(e){}
 try{D.settings.pendingNews=v;persist()}catch(e){}
 try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
 try{if(swReg)await swReg.update()}catch(e){}
 location.replace(location.pathname+'?v='+encodeURIComponent(v));
}
async function checkUpdate(manual){
 const st=$('#updstat'),say=t=>{if(st)st.innerHTML=t};
 if(manual)say('⏳ Έλεγχος…');
 try{
  REMOTE=await fetchRemote();D.settings.lastCheck=new Date().toISOString();persist();
  if(vcmp(REMOTE.version,APP_VERSION)>0){
   let tried='';try{tried=sessionStorage.getItem('updTried')}catch(e){}
   const busy=$('#dlg').open;
   if(manual||(!busy&&tried!==REMOTE.version)){say('⬇ Βρέθηκε η έκδοση '+esc(REMOTE.version)+' — αναβάθμιση…');toast('Αναβάθμιση στην έκδοση '+REMOTE.version+'…');setTimeout(()=>applyUpdate(REMOTE.version),800)}
   else say('Υπάρχει νέα έκδοση '+esc(REMOTE.version)+' — πατήστε «Έλεγχος για αναβάθμιση».');
  }else say('✓ Έχετε την τελευταία έκδοση ('+APP_VERSION+') · έλεγχος '+hm(new Date()));
 }catch(e){if(manual)say('✕ Δεν έγινε έλεγχος (χωρίς σύνδεση;)')}
}
async function showNews(v){
 let r=REMOTE;if(!r){try{r=await fetchRemote()}catch(e){}}
 const list=(r&&r.changes)||[];
 const items=list.filter(c=>!v||vcmp(c.version,APP_VERSION)<=0).slice(0,v?1:8);
 openDlg(`<h2>${v?'Αναβαθμίστηκε στην έκδοση '+esc(APP_VERSION):'Τι νέο'}</h2>${items.length?items.map(c=>`<h3>Έκδοση ${esc(c.version)} <span class="mut">${esc(c.date||'')}</span></h3><ul style="margin:0 0 8px;padding-left:20px">${(c.notes||[]).map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`).join(''):'<p class="mut">Δεν υπάρχουν σημειώσεις.</p>'}<div class="acts"><button type="button" class="pri" data-act="close">Εντάξει</button></div>`,()=>{});
}
function afterStart(){
 if(LOCKED){const iv=setInterval(()=>{if(!LOCKED){clearInterval(iv);afterStart()}},1000);return}
 if(D.settings.pendingNews&&vcmp(APP_VERSION,D.settings.pendingNews)>=0){delete D.settings.pendingNews;persist();setTimeout(()=>showNews(APP_VERSION),400)}
 if(D.settings.seenVersion&&vcmp(APP_VERSION,D.settings.seenVersion)>0&&!$('#dlg').open)setTimeout(()=>{if(!$('#dlg').open)showNews(APP_VERSION)},600);
 D.settings.seenVersion=APP_VERSION;persist();
 setTimeout(()=>checkUpdate(false),2500);
 setInterval(()=>checkUpdate(false),3*3600e3);
}

function thumb(file,M,q){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q||0.7))};img.onerror=()=>rej(new Error('Η φωτογραφία δεν διαβάστηκε'));img.src=u})}
function parseDT(d,h){const [y,mo,da]=d.split('-').map(Number),[hh,mi]=(h||'00:00').split(':').map(Number);return new Date(y,mo-1,da,hh,mi)}
function fmtNum(v){return String(Math.round(v*10)/10).replace('.',',')}
async function aiJSON(content){if(!getKey())throw Object.assign(new Error('Χρειάζεται δωρεάν κλειδί τεχνητής νοημοσύνης (Περισσότερα → Τεχνητή νοημοσύνη)'),{nokey:true});
 const models=await freeModels(false);try{return await aiCall(content,models.slice(0,6))}catch(e){if(e.fatal)throw e;return await aiCall(content,(await freeModels(true)).slice(0,6))}}
function patientInfo(){const p=D.profile,a=ageOf();return[a!=null?'ηλικία '+a:'',p.sex==='m'?'άνδρας':p.sex==='f'?'γυναίκα':'',p.weight?'βάρος '+p.weight+' κιλά':'',p.diabetes?'διαβήτης':'',p.kidney?'νεφρική νόσος':'',p.heart?'καρδιοπάθεια':'',p.smoker?'καπνιστής':'',p.conditions?'παθήσεις: '+p.conditions:'',p.allergies?'αλλεργίες: '+p.allergies:''].filter(Boolean).join('· ')}

/* ---------- Γενικό γράφημα γραμμής ---------- */
function lineChart(series,refs){
 const all=series.flatMap(s=>s.pts);if(all.length<2)return '<p class="mut">Χρειάζονται τουλάχιστον 2 μετρήσεις για γράφημα.</p>';
 const W=340,H=180,L=36,R=8,T=8,B=22;
 const ts=all.map(p=>+new Date(p.t)),t0=Math.min(...ts),t1=Math.max(...ts),span=Math.max(t1-t0,1);
 const vs=all.map(p=>p.v).concat((refs||[]).map(r=>r.v));let lo=Math.min(...vs),hi=Math.max(...vs);const pd=(hi-lo)*0.12||1;lo-=pd;hi+=pd;
 const x=t=>L+(t-t0)/span*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${fmtNum(v)}</text>`}
 (refs||[]).forEach(r=>s+=`<line x1="${L}" x2="${W-R}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="${r.c||'var(--mut)'}" stroke-dasharray="4 4"/>`);
 series.forEach(se=>{const pts=se.pts.slice().sort((a,b)=>a.t<b.t?-1:1);
  s+=`<polyline fill="none" stroke="${se.c}" stroke-width="2" points="${pts.map(p=>x(+new Date(p.t)).toFixed(1)+','+y(p.v).toFixed(1)).join(' ')}"/>`;
  if(pts.length<=60)pts.forEach(p=>s+=`<circle cx="${x(+new Date(p.t)).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.8" fill="${se.c}"/>`)});
 const d0=new Date(t0),d1=new Date(t1);
 return s+`<text x="${L}" y="${H-5}">${pad(d0.getDate())}/${pad(d0.getMonth()+1)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${pad(d1.getDate())}/${pad(d1.getMonth()+1)}</text></svg>`;
}
function spark(vals,c){if(vals.length<2)return '';const W=70,H=22,lo=Math.min(...vals),hi=Math.max(...vals),r=hi-lo||1;return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="${c||'var(--pri)'}" stroke-width="2" points="${vals.map((v,i)=>(i/(vals.length-1)*(W-4)+2).toFixed(1)+','+(H-2-(v-lo)/r*(H-4)).toFixed(1)).join(' ')}"/></svg>`}

function savePeople(){try{localStorage.setItem(PKEY,JSON.stringify(PEOPLE))}catch(e){}}
function personData(p){if(p.id===PEOPLE.cur)return D;try{return fix(JSON.parse(localStorage.getItem(p.key)))}catch(e){return fix({})}}
function personLabel(p){const d=personData(p);return (d.profile&&d.profile.name)||p.label||'Εγώ'}
function switchPerson(id){const p=PEOPLE.list.find(x=>x.id===id);if(!p)return;persist();PEOPLE.cur=id;savePeople();KEY=p.key;D=load();render();toast('Άνοιξε ο φάκελος: '+personLabel(p))}
function addPerson(name){const id='p'+uid(),key='fakelosYgeias_'+id;try{localStorage.setItem(key,JSON.stringify(fix({profile:{name}})))}catch(e){}PEOPLE.list.push({id,key,label:name});savePeople();switchPerson(id)}
function delPerson(id){const p=PEOPLE.list.find(x=>x.id===id);if(!p||PEOPLE.list.length<2)return;
 if(!confirm('Να διαγραφεί ο φάκελος «'+personLabel(p)+'» με όλα του τα δεδομένα;')||!confirm('Σίγουρα; Δεν αναιρείται (εκτός από αντίγραφο ασφαλείας).'))return;
 PEOPLE.list=PEOPLE.list.filter(x=>x.id!==id);try{localStorage.removeItem(p.key)}catch(e){}if(PEOPLE.cur===id){PEOPLE.cur=PEOPLE.list[0].id;KEY=PEOPLE.list[0].key;D=load()}savePeople();$('#dlg').close();render();peopleDlg()}

 openDlg(`<h2>Άτομα ${hq('people')}</h2>
 ${PEOPLE.list.map(p=>`<div class="dose"><div class="grow"><b>👤 ${esc(personLabel(p))}</b>${p.id===PEOPLE.cur?' <span class="tag">ανοιχτό</span>':''}</div>${p.id!==PEOPLE.cur?`<button type="button" class="small pri" data-act="pswitch" data-id="${p.id}">Άνοιγμα</button>`:''}${PEOPLE.list.length>1?`<button type="button" class="small danger" data-act="pdel" data-id="${p.id}">✕</button>`:''}</div>`).join('')}

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

 <label>Ξανά ο νέος κωδικός<input type="password" inputmode="numeric" name="p2" required autocomplete="off"></label>${btns()}`,
 async fd=>{},);
 const f=$('#dform');f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),c=lockCfg();
  if(change&&c&&await sha(c.salt+fd.get('old'))!==c.hash){alert('Λάθος τωρινός κωδικός.');return}

  const salt=b64(crypto.getRandomValues(new Uint8Array(12)));localStorage.setItem(LKEY,JSON.stringify({salt,hash:await sha(salt+p1),bio:c&&c.bio||''}));$('#dlg').close();render();toast('Ο κωδικός ορίστηκε')};
}

const labInfo=n=>LABS.find(x=>x.re.test(n||''));
function labFlag(r){const lo=r.lo!==''&&r.lo!=null?+r.lo:null,hi=r.hi!==''&&r.hi!=null?+r.hi:null;if(hi!=null&&r.v>hi)return{s:'↑',c:'var(--red)',t:'πάνω από το φυσιολογικό'};if(lo!=null&&r.v<lo)return{s:'↓',c:'var(--blue)',t:'κάτω από το φυσιολογικό'};if(lo==null&&hi==null)return{s:'',c:'var(--mut)',t:''};return{s:'✓',c:'var(--green)',t:'φυσιολογικό'}}
function labGroups(){const g={};D.labs.forEach(r=>{(g[r.name]=g[r.name]||[]).push(r)});Object.values(g).forEach(l=>l.sort((a,b)=>a.d<b.d?1:-1));return Object.entries(g).sort((a,b)=>a[1][0].d<b[1][0].d?1:a[1][0].d>b[1][0].d?-1:a[0].localeCompare(b[0],'el'))}

 let h=`<div class="card"><div class="row sp"><h2 style="margin:0">🧪 Εξετάσεις αίματος ${hq('labs')}</h2></div>
 <div class="row" style="margin-top:10px"><button class="pri grow" data-act="labphoto">📷 Φωτογραφία εξετάσεων</button><button class="grow" data-act="addlab">+ Χειροκίνητα</button></div>

 const g=labGroups();
 if(!g.length)return h+`<div class="card"><p class="mut">Δεν έχουν καταχωριστεί εξετάσεις.</p></div>`;
 const flagged=g.filter(([n,l])=>labFlag(l[0]).s==='↑'||labFlag(l[0]).s==='↓');
 if(flagged.length)h+=`<div class="card warn"><h2>Εκτός ορίων στην τελευταία μέτρηση</h2>${flagged.map(([n,l])=>{const f=labFlag(l[0]);return `<div class="edf" data-act="labdetail" data-n="${esc(n)}"><b style="color:${f.c}">${f.s} ${esc(n)}</b>: ${fmtNum(l[0].v)} ${esc(l[0].u||'')} <span class="mut">(${fmtS(fromKey(l[0].d))})</span></div>`}).join('')}<div class="mut" style="margin-top:6px">Συζητήστε τα με τον γιατρό σας.</div></div>`;
 h+=`<div class="card"><h2>Όλες οι εξετάσεις</h2>${g.map(([n,l])=>{const r=l[0],f=labFlag(r),vals=l.slice(0,10).reverse().map(x=>x.v);return `<div class="dose edf" data-act="labdetail" data-n="${esc(n)}"><div class="grow"><b>${esc(n)}</b><div class="mut">${fmtS(fromKey(r.d))}${l.length>1?' · '+l.length+' μετρήσεις':''}${r.lo!==''&&r.lo!=null||r.hi!==''&&r.hi!=null?' · όρια '+(r.lo??'')+'–'+(r.hi??''):''}</div></div>${spark(vals,f.c)}<div style="text-align:right;min-width:74px"><b style="color:${f.c}">${f.s} ${fmtNum(r.v)}</b><div class="mut" style="font-size:12px">${esc(r.u||'')}</div></div></div>`}).join('')}</div>`;
 return h;
}

const SYMS2=['ζάλη','πονοκέφαλος','κούραση','ταχυκαρδία','πόνος στο στήθος','δύσπνοια','ναυτία','βήχας','πρήξιμο στα πόδια','αϋπνία','άγχος','πόνος στις αρθρώσεις','εξάνθημα','στομαχόπονος','θολή όραση','μυϊκοί πόνοι'];
function symCtx(s){const t=new Date(s.t),out=[];
 Object.entries(D.doses).forEach(([k,r])=>{if(r.s!=='taken')return;const [d,id]=k.split('|');if(d!==dkey(t)&&d!==dkey(new Date(+t-864e5)))return;const m=D.meds.find(x=>x.id===id);if(!m||!r.at)return;const at=parseDT(d,r.at),mn=(t-at)/60000;if(mn>=0&&mn<=240)out.push(`${m.name} πριν ${mn<60?Math.round(mn)+' λεπτά':fmtNum(mn/60)+' ώρες'}`)});
 const bp=D.bp.map(r=>({r,dt:Math.abs(new Date(r.t)-t)})).filter(x=>x.dt<=120*60000).sort((a,b)=>a.dt-b.dt)[0];
 return {meds:out,bp:bp?bp.r:null}}

/* ---------- Πιεσόμετρο με ασύρματη σύνδεση ---------- */
function sfloat(v){let m=v&0x0FFF,e=v>>12;if(m>=0x800)m-=0x1000;if(e>=8)e-=16;return m*Math.pow(10,e)}
async function bleBP(){
 const dev=await navigator.bluetooth.requestDevice({filters:[{services:[0x1810]}]});
 const srv=await dev.gatt.connect(),s=await srv.getPrimaryService(0x1810),ch=await s.getCharacteristic(0x2A35);
 return new Promise((res,rej)=>{let got=null,tm=null;const done=()=>{try{dev.gatt.disconnect()}catch(_){}res(got)};
  const to=setTimeout(()=>{if(got)done();else{try{dev.gatt.disconnect()}catch(_){}rej(new Error('Δεν ήρθε μέτρηση. Κάντε μέτρηση με το πιεσόμετρο και ξαναδοκιμάστε.'))}},90000);
  ch.addEventListener('characteristicvaluechanged',e=>{const v=e.target.value,f=v.getUint8(0);let o=7;const kpa=f&1;let sys=sfloat(v.getUint16(1,true)),dia=sfloat(v.getUint16(3,true));if(kpa){sys*=7.50062;dia*=7.50062}if(f&2)o+=7;const pulse=(f&4)?sfloat(v.getUint16(o,true)):null;
   got={sys:Math.round(sys),dia:Math.round(dia),pulse:pulse?Math.round(pulse):null};clearTimeout(tm);tm=setTimeout(()=>{clearTimeout(to);done()},2500)}); // κρατάμε την τελευταία (πιο πρόσφατη)
  ch.startNotifications().catch(e=>{clearTimeout(to);rej(e)})});
}
async function bleFill(){const st=$('#blest');if(st)st.textContent='⏳ Επιλέξτε το πιεσόμετρο και κάντε μέτρηση…';
 try{const r=await bleBP();const f=$('#dform');if(!f||!r)return;f.elements.sys.value=r.sys;f.elements.dia.value=r.dia;if(r.pulse)f.elements.pulse.value=r.pulse;if(st)st.textContent='✓ Ήρθε η μέτρηση '+r.sys+'/'+r.dia+(r.pulse?' ♥ '+r.pulse:'')}catch(e){if(st)st.textContent='✕ '+(e.name==='NotFoundError'?'Δεν επιλέχθηκε συσκευή.':e.message)}}

function mapUrl(o){if(!o)return '';const co=String(o.coords||'').trim();
 if(/^https?:\/\//i.test(co))return co;
 const m=co.match(/(-?\d{1,3}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)/)||co.replace(/(\d),(\d)/g,'$1.$2').match(/(-?\d{1,3}(?:\.\d+)?)\s+(-?\d{1,3}(?:\.\d+)?)/);
 if(m)return 'https://www.google.com/maps/search/?api=1&query='+m[1]+','+m[2];
 if(o.addr)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(o.addr);return ''}
const pinLink=o=>{const u=mapUrl(o);return u?`<a class="tel" data-act="call" target="_blank" rel="noopener" href="${u}">📍 Χάρτης</a>`:''};
const addrText=o=>[o.addr,o.floor?('όροφος '+o.floor):''].filter(Boolean).join(', ');
function geoFill(btn){const inp=btn.parentElement.querySelector('input');if(!navigator.geolocation){alert('Η συσκευή δεν δίνει τοποθεσία.');return}btn.disabled=true;btn.textContent='⏳';
 navigator.geolocation.getCurrentPosition(p=>{inp.value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);btn.disabled=false;btn.textContent='📍';inp.dispatchEvent(new Event('input',{bubbles:true}))},e=>{btn.disabled=false;btn.textContent='📍';alert('Δεν βρέθηκε η τοποθεσία. Επιτρέψτε την πρόσβαση στην τοποθεσία ή γράψτε τις συντεταγμένες.')},{enableHighAccuracy:true,timeout:15000})}
const coordsField=(name,val)=>`<label>Συντεταγμένες ή σύνδεσμος χάρτη ${hq('coords')}<div class="row" style="flex-wrap:nowrap"><input name="${name}" value="${esc(val||'')}" placeholder="π.χ. 37.9838, 23.7275" style="margin:0"><button type="button" class="small" data-act="geo" title="Τρέχουσα θέση">📍</button></div></label>`;

function rowHTML(kind,r,i){const c=ROWCFG[kind];r=r||{};const empty=!c.f.some(([k])=>r[k]);
 return `<fieldset class="rowset"><legend>${kind==='contacts'?'👤 Επαφή':'🩺 Γιατρός'} <span class="rn">${i||''}</span>${empty?' <span class="mut">(νέος)</span>':''}</legend><div class="g2">${c.f.map(([k,l,t])=>t==='coords'?`<div style="grid-column:1/-1">${coordsField('f_'+k,r[k])}</div>`:`<label ${k==='addr'||k==='note'?'style="grid-column:1/-1"':''}>${l}<input name="f_${k}" value="${esc(r[k]||'')}" ${t==='tel'?'type="tel" inputmode="tel" autocomplete="off"':''} ${t==='spec'?'list="speclist"':''}></label>`).join('')}</div>

/* ---------- Χρωματική μπάρα πίεσης ---------- */
const BPZ=[{t:'Χαμηλή',c:'var(--blue)',s:[70,90],d:[40,60],r:'κάτω από 90/60'},{t:'Φυσιολογική',c:'var(--green)',s:[90,135],d:[60,85],r:'90–134 / 60–84'},{t:'Οριακά υψηλή',c:'var(--yellow)',s:[135,140],d:[85,90],r:'135–139 / 85–89'},{t:'Υψηλή 1ου βαθμού',c:'var(--orange)',s:[140,160],d:[90,100],r:'140–159 / 90–99'},{t:'Υψηλή 2ου βαθμού',c:'var(--red)',s:[160,180],d:[100,110],r:'160–179 / 100–109'},{t:'Πολύ υψηλή',c:'#8e0000',s:[180,220],d:[110,130],r:'180 / 110 και πάνω'}];
function zpos(v,key){for(let i=0;i<BPZ.length;i++){const [a,b]=BPZ[i][key];if(v<b||i===BPZ.length-1){const f=Math.max(0,Math.min(1,(v-a)/(b-a)));return (i+f)/BPZ.length*100}}return 50}
function bpPos(s,d){const ps=zpos(s,'s'),pd=zpos(d,'d');return (s<90||d<60)&&!(s>=135||d>=85)?Math.min(ps,pd):Math.max(ps,pd)}
function bpMeter(s,d,label){if(!s||!d)return '';const p=Math.max(1.5,Math.min(98.5,bpPos(s,d)));
 return `<div class="bpm" role="button" tabindex="0" data-act="help" data-k="bpmeter" data-s="${s}" data-d="${d}" data-l="${esc(label||'')}"><div class="bpbar">${BPZ.map(z=>`<span style="background:${z.c}"></span>`).join('')}</div><i style="left:${p}%"></i><div class="bplbl"><span>χαμηλή</span><span>φυσιολογική</span><span>υψηλή</span></div></div>`}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.bpm');if(b)window._bpm={s:+b.dataset.s,d:+b.dataset.d,l:b.dataset.l}},true);
HELP.bpmeter=()=>{const m=window._bpm||{},zi=Math.min(BPZ.length-1,Math.floor(bpPos(m.s,m.d)/100*BPZ.length)),t=target(ageOf());
 return['Πού βρίσκεται η πίεσή σας',`${m.s?`${m.l?esc(m.l)+': ':''}<b style="font-size:1.2em">${m.s}/${m.d}</b> → ζώνη <b style="color:${BPZ[zi].c}">${BPZ[zi].t}</b><br><br>`:''}
 ${BPZ.map((z,i)=>`<div style="display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;${i===zi?'background:var(--pri2);font-weight:700':''}"><span style="width:18px;height:12px;border-radius:3px;background:${z.c};flex:none"></span><span class="grow">${z.t}</span><span class="mut" style="font-size:13px">${z.r}</span>${i===zi?' ◀':''}</div>`).join('')}
 <br>Όρια για μετρήσεις <b>στο σπίτι</b>. Η θέση στη μπάρα βγαίνει από τη χειρότερη από τις δύο τιμές (μεγάλη ή μικρή). Ο δικός σας στόχος: <b>${t.txt}</b>.<br><br>Μία μέτρηση δεν αρκεί — σημασία έχει ο μέσος όρος πολλών ημερών. ${m.s>=180||m.d>=110?'<br><br><b style="color:var(--red)">Ξαναμετρήστε σε 5 λεπτά. Αν μείνει τόσο ψηλά ή έχετε πόνο στο στήθος, δύσπνοια, αδυναμία ή θολή όραση, καλέστε το 166.</b>':''}`]};

/* ---------- PDF χωρίς εξωτερικές βιβλιοθήκες ---------- */
function b64bytes(d){const s=atob(d.split(',')[1]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function makePDF(pages){ // pages: [{jpg:Uint8Array,w,h}]
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
 const n=pages.length,W=595.28,H=841.89;push('%PDF-1.4\n');
 const obj=(id,body,bin)=>{offs[id]=len;push(id+' 0 obj\n'+body);if(bin){push(bin);push('\nendstream')}push('\nendobj\n')};
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')}] /Count ${n} >>`);
 pages.forEach((pg,i)=>{const pid=3+3*i,cid=pid+1,iid=pid+2,cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`);
  obj(cid,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  obj(iid,`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.jpg.length} >>\nstream\n`,pg.jpg)});
 const total=3+3*n,xref=len;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
 push(x+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
 return new Blob(parts,{type:'application/pdf'});
}
function htmlToPages(box){ // σχεδιάζει το περιεχόμενο της αναφοράς σε σελίδες Α4
 const PW=1240,PH=1754,M=80,F='system-ui,-apple-system,Roboto,"Segoe UI",sans-serif',pages=[];let c,x,y;
 const newPage=()=>{c=document.createElement('canvas');c.width=PW;c.height=PH;x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,PW,PH);x.textBaseline='top';y=M;pages.push(c);
  x.font=`20px ${F}`;x.fillStyle='#888';x.fillText((D.profile.name||'')+' · '+fmtS(new Date())+' · '+pages.length,M,PH-50)};
 const ensure=h=>{if(y+h>PH-M)newPage()};
 const wrap=(t,w)=>{const out=[];String(t).split('\n').forEach(par=>{const ws=par.split(/\s+/);let cur='';ws.forEach(wd=>{const tt=cur?cur+' '+wd:wd;if(x.measureText(tt).width>w&&cur){out.push(cur);cur=wd}else cur=tt});out.push(cur)});return out};
 const text=(t,size,opt)=>{opt=opt||{};x.font=`${opt.b?'bold ':''}${size}px ${F}`;const lines=wrap(t,PW-2*M-(opt.ind||0));lines.forEach(l=>{ensure(size*1.35);x.fillStyle=opt.col||'#111';x.fillText(l,M+(opt.ind||0),y);y+=size*1.35})};
 newPage();
 [...box.children].forEach(el=>{const tag=el.tagName;if(tag==='STYLE')return;const t=el.innerText.trim();if(!t&&tag!=='TABLE')return;
  if(tag==='H2'){text(t,44,{b:1});y+=6}
  else if(tag==='H3'){y+=18;ensure(80);text(t,32,{b:1,col:'#0f766e'});x.fillStyle='#0f766e';x.fillRect(M,y,PW-2*M,3);y+=12}
  else if(tag==='OL'||tag==='UL'){[...el.children].forEach((li,i)=>text((tag==='OL'?(i+1)+'. ':'• ')+li.innerText.trim(),25,{ind:10}))}
  else if(tag==='TABLE'){const rows=[...el.rows].map(r=>[...r.cells].map(cl=>cl.innerText.trim()));if(!rows.length)return;const nc=Math.max(...rows.map(r=>r.length));
   x.font=`22px ${F}`;const lens=Array.from({length:nc},(_,j)=>Math.min(38,Math.max(8,2+(rows[0][j]||'').length,...rows.map(r=>(r[j]||'').length))));const sum=lens.reduce((a,b)=>a+b,0),TW=PW-2*M,ws=lens.map(l=>l/sum*TW);
   rows.forEach((r,ri)=>{x.font=`${ri===0?'bold ':''}22px ${F}`;const cells=r.map((v,j)=>wrap(v,ws[j]-12));const h=Math.max(1,...cells.map(l=>l.length))*28+12;ensure(h);
    if(ri===0){x.fillStyle='#eef6f5';x.fillRect(M,y,TW,h)}let cx=M;cells.forEach((ls,j)=>{x.fillStyle=ri===0?'#333':'#111';ls.forEach((l,k)=>x.fillText(l,cx+6,y+6+k*28));cx+=ws[j]});
    y+=h;x.fillStyle='#ccc';x.fillRect(M,y-1,TW,1)});y+=8}
  else text(t,25)});
 return pages;
}

  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Ιατρική αναφορά'});say('✓ Στάλθηκε')}catch(e){say('')}}

 }catch(e){say('✕ '+e.message)}}
