<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Φάκελος Υγείας</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Υγεία">
<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#17201e;--mut:#5f6b68;--line:#dde4e2;--pri:#0f766e;--onpri:#fff;--pri2:#dff2ee;--head:#0f766e;--red:#c62828;--redbg:#fdecea;--orange:#d9700f;--yellow:#b58f00;--green:#2e7d32;--blue:#1565c0;--sh:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1312;--card:#192120;--tx:#e7eeec;--mut:#9aa8a4;--line:#2b3533;--pri:#2dd4bf;--onpri:#05201d;--pri2:#11342f;--head:#0b4f49;--red:#ef5350;--redbg:#3a1b1b;--orange:#f39c4a;--yellow:#e6c229;--green:#66bb6a;--blue:#64b5f6;--sh:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:19px;margin:0}
header small{opacity:.85;font-size:13px}
main{max-width:720px;margin:0 auto;padding:12px 14px}
section.tab{display:none}section.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--sh)}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:15px;margin:12px 0 6px}
.mut{color:var(--mut);font-size:14px}
.big{font-size:30px;font-weight:700;line-height:1.1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 13px;cursor:pointer;min-height:42px}
button.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:600}
button.ok{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
button.danger{color:var(--red);border-color:var(--red)}
button.small{min-height:34px;padding:5px 10px;font-size:14px}
button.wide{width:100%}
button:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;background:var(--card);min-height:34px}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:13px;background:var(--pri2);color:var(--tx);margin:2px 4px 2px 0}
.dose{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.dose:first-of-type{border-top:0}
.dose .t{font-weight:700;font-size:18px;min-width:56px}
.dose.late .t{color:var(--red)}
.dose.done{opacity:.65}
.st{font-size:14px;font-weight:600}
.warn{background:var(--redbg);border-color:var(--red)}
.pill{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 5px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:7px 2px 6px;min-height:62px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--pri);font-weight:700}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,96vw);max-height:92vh;background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px}
dialog h2{margin:0 0 12px;font-size:19px}
label{display:block;font-size:14px;color:var(--mut);margin:0 0 10px}
input,select,textarea{display:block;width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:8px 10px}
legend{font-size:14px;color:var(--mut);padding:0 4px}
.ck{display:inline-flex;align-items:center;gap:5px;margin:4px 10px 4px 0;color:var(--tx);font-size:15px}
.ck input{width:auto;min-height:0;margin:0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.times{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.times .row input{flex:1;margin:0}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#banner{display:none;position:sticky;top:0;z-index:4;background:var(--orange);color:#fff;padding:10px 14px;font-weight:600}
.hcard{font-size:16px}
.hcard.bigtxt{font-size:21px}
.hcard .lbl{color:var(--mut);font-size:.8em;margin-top:8px}
.hcard .al{color:var(--red);font-weight:700}
.hcard table{font-size:1em}
svg text{fill:var(--mut);font-size:10px}
.bpv{font-weight:700}
.aibox{background:var(--pri2);border-radius:12px;padding:10px;margin-bottom:12px}
details summary{cursor:pointer}
.list-day{margin-top:10px;font-weight:700;font-size:14px;color:var(--mut)}
#print{display:none}
@media print{
 body{background:#fff;color:#000;padding:0}
 body.printing>*:not(#print){display:none!important}
 body.printing #print{display:block;padding:10mm;font-size:12pt}
 #print table{font-size:10.5pt}#print th,#print td{border-bottom:1px solid #999;color:#000}
}
</style>
</head>
<body>
<header><div><h1>Φάκελος Υγείας</h1><small id="hdate"></small></div><button class="small" data-act="addbp" style="background:#ffffff22;color:#fff;border-color:#ffffff55">+ Πίεση</button></header>
<div id="banner"></div>
<main>
 <section class="tab on" id="t-sim"></section>
 <section class="tab" id="t-pie"></section>
 <section class="tab" id="t-far"></section>
 <section class="tab" id="t-kar"></section>
 <section class="tab" id="t-per"></section>
</main>
<nav>
 <button data-tab="sim" class="on"><span>🏠</span>Σήμερα</button>
 <button data-tab="pie"><span>❤️</span>Πίεση</button>
 <button data-tab="far"><span>💊</span>Φάρμακα</button>
 <button data-tab="kar"><span>🏥</span>Κάρτα</button>
 <button data-tab="per"><span>☰</span>Περισσότερα</button>
</nav>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<div id="print"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" style="display:none">
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* ---------- Βασικά ---------- */
const KEY='fakelosYgeias', SUB='Fakelos-Ygeias';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MERES=['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
const MERES_S=['Κυ','Δε','Τρ','Τε','Πε','Πα','Σα'];
const MHNES=['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];
const fmtD=d=>d.getDate()+' '+MHNES[d.getMonth()]+' '+d.getFullYear();
const fmtS=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const FOOD={'':'','prin':'πριν το φαγητό','me':'με το φαγητό','meta':'μετά το φαγητό','nistis':'νηστικός','adiaforo':'ανεξάρτητα από φαγητό'};
const FORMS=['δισκίο','κάψουλα','σταγόνες','σιρόπι','φακελάκι','ένεση','εισπνοές','αλοιφή / κρέμα','έμπλαστρο','άλλο'];
const ZONES=[{n:'Πρωί',a:5,b:12,l:'05–12'},{n:'Μεσημέρι',a:12,b:17,l:'12–17'},{n:'Απόγευμα',a:17,b:21,l:'17–21'},{n:'Βράδυ',a:21,b:29,l:'21–05'}];
const zoneOf=d=>{let h=d.getHours();if(h<5)h+=24;return ZONES.find(z=>h>=z.a&&h<z.b)};
const SYMS=['ζάλη','πονοκέφαλος','κούραση','ταχυκαρδία','πόνος στο στήθος','θολή όραση','δύσπνοια'];

function fix(d){d=d||{};d.profile=d.profile||{};d.bp=d.bp||[];d.meds=d.meds||[];d.doses=d.doses||{};d.appts=d.appts||[];d.settings=d.settings||{};d.notified=d.notified||{};if(d.settings.period==null)d.settings.period=30;if(d.settings.sound==null)d.settings.sound=true;return d}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)return fix(x)}catch(e){}return fix({})}
let D=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Αποτυχία αποθήκευσης στη συσκευή')}}
function save(){persist();schedBackup()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}

/* ---------- Κατάταξη πίεσης ---------- */
function bpClass(s,d){
 if(s>=180||d>=110)return{t:'Πολύ υψηλή',c:'var(--red)',warn:'Πολύ υψηλή πίεση. Ξεκουραστείτε 5 λεπτά και ξαναμετρήστε. Αν παραμένει τόσο ψηλά ή έχετε πόνο στο στήθος, δύσπνοια, αδυναμία ή θολή όραση, καλέστε αμέσως το 166 ή τον γιατρό σας.'};
 if(s<90||d<60)return{t:'Χαμηλή',c:'var(--blue)',warn:(s<80?'Πολύ χαμηλή πίεση. Αν έχετε ζάλη ή λιποθυμική τάση, ξαπλώστε και επικοινωνήστε με γιατρό.':'')};
 if(s>=160||d>=100)return{t:'Υψηλή (2ου βαθμού)',c:'var(--red)'};
 if(s>=140||d>=90)return{t:'Υψηλή (1ου βαθμού)',c:'var(--orange)'};
 if(s>=135||d>=85)return{t:'Οριακά υψηλή (για μέτρηση σπιτιού)',c:'var(--yellow)'};
 if(s>=120||d>=80)return{t:'Φυσιολογική',c:'var(--green)'};
 return{t:'Άριστη',c:'var(--green)'};
}
function bpStats(list){
 if(!list.length)return null;
 const av=f=>{const v=list.filter(r=>r[f]);return v.length?Math.round(v.reduce((a,r)=>a+r[f],0)/v.length):null};
 const sys=list.map(r=>r.sys);
 return{n:list.length,sys:av('sys'),dia:av('dia'),pulse:av('pulse'),maxS:Math.max(...sys),minS:Math.min(...sys),
  maxD:Math.max(...list.map(r=>r.dia)),minD:Math.min(...list.map(r=>r.dia)),high:list.filter(r=>r.sys>=135||r.dia>=85).length};
}
function bpInPeriod(){const p=+D.settings.period;const lim=p?Date.now()-p*864e5:0;return D.bp.filter(r=>+new Date(r.t)>=lim).sort((a,b)=>a.t<b.t?1:-1)}

/* ---------- Πρόγραμμα φαρμάκων ---------- */
function scheduledOn(m,date){
 if(!m.active||m.prn)return false;
 const k=dkey(date);
 if(m.start&&k<m.start)return false;
 if(m.until&&k>m.until)return false;
 if(m.days&&m.days.length&&m.days.length<7)return m.days.includes(date.getDay());
 return true;
}
function dueList(date){const o=[];D.meds.forEach(m=>{if(scheduledOn(m,date))(m.times||[]).forEach(t=>o.push({med:m,time:t}))});return o.sort((a,b)=>a.time.localeCompare(b.time))}
const doseKey=(date,m,t)=>dkey(date)+'|'+m.id+'|'+t;
function adherence(m,days){
 let due=0,tk=0;const now=new Date(),nm=now.getHours()*60+now.getMinutes();
 for(let i=0;i<days;i++){const d=new Date(now);d.setDate(d.getDate()-i);if(!scheduledOn(m,d))continue;
  (m.times||[]).forEach(t=>{const [h,mi]=t.split(':').map(Number);if(i===0&&h*60+mi>nm)return;due++;const r=D.doses[doseKey(d,m,t)];if(r&&r.s==='taken')tk++})}
 return due?Math.round(tk/due*100):null;
}
function daysLeft(m){
 if(m.stock===''||m.stock==null||m.prn)return null;
 const per=(+m.perDose||1)*((m.times||[]).length||1)*((m.days&&m.days.length&&m.days.length<7)?m.days.length/7:1);
 return per?Math.floor(+m.stock/per):null;
}
function medTitle(m){return esc(m.name)+(m.strength?' <span class="mut">'+esc(m.strength)+'</span>':'')}
function freqText(m){
 if(m.prn)return 'όταν χρειάζεται';
 let s=(m.times||[]).join(', ');
 if(m.days&&m.days.length&&m.days.length<7)s+=' · '+m.days.map(d=>MERES_S[d]).join(' ');
 return s||'χωρίς ώρα';
}
function addHist(m,text){m.history=m.history||[];m.history.push({t:new Date().toISOString(),text})}

/* ---------- Καρτέλες ---------- */
let TAB='sim';
function showTab(t){TAB=t;document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('on',s.id==='t-'+t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render();scrollTo(0,0)}
function render(){
 const n=new Date();$('#hdate').textContent=MERES[n.getDay()]+', '+fmtD(n);
 ({sim:rSim,pie:rPie,far:rFar,kar:rKar,per:rPer})[TAB]();
 checkBanner();
}

/* ---- Σήμερα ---- */
function rSim(){
 const now=new Date(),nm=now.getHours()*60+now.getMinutes(),list=dueList(now);
 let h='';
 if('Notification' in window&&Notification.permission==='default'&&D.meds.length)
  h+=`<div class="card"><div class="row sp"><div class="grow"><b>Ειδοποιήσεις για τα χάπια</b><div class="mut">Επιτρέψτε στην εφαρμογή να σας ειδοποιεί την ώρα κάθε λήψης.</div></div><button class="pri" data-act="notifon">Ενεργοποίηση</button></div></div>`;
 // Επόμενη λήψη
 const pend=list.filter(i=>!D.doses[doseKey(now,i.med,i.time)]);
 const next=pend.find(i=>{const [a,b]=i.time.split(':').map(Number);return a*60+b>=nm-30});
 const taken=list.filter(i=>(D.doses[doseKey(now,i.med,i.time)]||{}).s==='taken').length;
 h+=`<div class="card"><h2>Φάρμακα σήμερα</h2>`;
 if(!D.meds.filter(m=>m.active).length){h+=`<p class="mut">Δεν έχετε καταχωρίσει φάρμακα ακόμη.</p><button class="pri wide" data-act="addmed">+ Προσθήκη φαρμάκου</button></div>`}
 else{
  h+=`<div class="row sp"><div><div class="big">${taken}/${list.length}</div><div class="mut">λήψεις ολοκληρώθηκαν</div></div>`+
   (next?`<div style="text-align:right"><div class="mut">Επόμενη</div><b style="font-size:20px">${next.time}</b><div>${esc(next.med.name)}</div></div>`:(list.length?`<div class="st" style="color:var(--green)">✓ Όλα εντάξει για σήμερα</div>`:''))+`</div>`;
  list.forEach(i=>{
   const m=i.med,k=doseKey(now,m,i.time),r=D.doses[k];const [a,b]=i.time.split(':').map(Number);
   const late=!r&&nm>a*60+b+30;
   h+=`<div class="dose ${r?'done':''} ${late?'late':''}"><div class="t">${i.time}</div><div class="grow"><div><b>${medTitle(m)}</b></div>
    <div class="mut">${esc(m.dose||'')}${m.food?' · '+FOOD[m.food]:''}</div>${m.purpose?`<div class="mut">Για: ${esc(m.purpose)}</div>`:''}
    ${r?`<div class="st" style="color:${r.s==='taken'?'var(--green)':'var(--mut)'}">${r.s==='taken'?'✓ Ελήφθη στις '+r.at:'Παραλείφθηκε'} <button class="small" data-act="undo" data-k="${k}">Αναίρεση</button></div>`
     :`${late?'<div class="st" style="color:var(--red)">Σε καθυστέρηση</div>':''}<div class="row" style="margin-top:6px"><button class="ok small" data-act="take" data-k="${k}">✓ Το πήρα</button><button class="small" data-act="skip" data-k="${k}">Παράλειψη</button></div>`}
   </div></div>`});
  if(!list.length)h+=`<p class="mut">Δεν υπάρχουν προγραμματισμένες λήψεις σήμερα.</p>`;
  h+=`</div>`;
 }
 // Όταν χρειάζεται
 const prn=D.meds.filter(m=>m.active&&m.prn);
 if(prn.length){h+=`<div class="card"><h2>Όταν χρειάζεται</h2>`;
  prn.forEach(m=>{const tk=Object.keys(D.doses).filter(k=>k.startsWith(dkey(now)+'|'+m.id+'|prn'));
   h+=`<div class="dose"><div class="grow"><b>${medTitle(m)}</b><div class="mut">${esc(m.dose||'')}${m.purpose?' · για: '+esc(m.purpose):''}</div>${tk.length?`<div class="mut">Σήμερα: ${tk.map(k=>D.doses[k].at).join(', ')}</div>`:''}</div><button class="small ok" data-act="prn" data-id="${m.id}">Το πήρα τώρα</button></div>`});
  h+=`</div>`}
 // Πίεση
 const last=D.bp.slice().sort((a,b)=>a.t<b.t?1:-1)[0];
 h+=`<div class="card"><div class="row sp"><h2 style="margin:0">Πίεση</h2><button class="pri" data-act="addbp">+ Νέα μέτρηση</button></div>`;
 if(last){const c=bpClass(last.sys,last.dia),d=new Date(last.t);
  const tday=D.bp.filter(r=>dkey(new Date(r.t))===dkey(now));
  h+=`<div class="row" style="margin-top:10px"><span class="pill" style="background:${c.c}"></span><span class="big">${last.sys}/${last.dia}</span>${last.pulse?`<span class="mut">♥ ${last.pulse}</span>`:''}</div>
   <div class="mut">${c.t} · ${dkey(d)===dkey(now)?'σήμερα':fmtS(d)} ${hm(d)} (${zoneOf(d).n.toLowerCase()})</div>
   <div class="mut">Μετρήσεις σήμερα: ${tday.length}</div>`}
 else h+=`<p class="mut">Καμία μέτρηση ακόμη.</p>`;
 h+=`</div>`;
 // Απόθεμα
 const low=D.meds.filter(m=>m.active&&daysLeft(m)!=null&&daysLeft(m)<=7);
 if(low.length)h+=`<div class="card warn"><h2>Τελειώνουν σύντομα</h2>${low.map(m=>`<div>💊 <b>${esc(m.name)}</b> — ${m.stock} τεμ., περίπου ${daysLeft(m)} ${daysLeft(m)===1?'ημέρα':'ημέρες'}</div>`).join('')}<div class="mut" style="margin-top:6px">Κλείστε συνταγή ή αγοράστε έγκαιρα.</div></div>`;
 // Ραντεβού
 const up=D.appts.filter(a=>!a.done&&a.d>=dkey(now)&&a.d<=dkey(new Date(Date.now()+14*864e5))).sort((a,b)=>(a.d+a.h)<(b.d+b.h)?-1:1);
 if(up.length)h+=`<div class="card"><h2>Ερχόμενα ραντεβού</h2>${up.map(a=>`<div style="margin-bottom:6px">📅 <b>${fmtS(fromKey(a.d))}${a.h?' '+a.h:''}</b> — ${esc(a.title)}${a.place?' <span class="mut">('+esc(a.place)+')</span>':''}</div>`).join('')}</div>`;
 $('#t-sim').innerHTML=h;
}

/* ---- Πίεση ---- */
function rPie(){
 const list=bpInPeriod(),st=bpStats(list),P=+D.settings.period;

 h+=`</table></div>`;

 h+=`</div>`;

function bpChart(list){
 if(list.length<2)return '<p class="mut">Χρειάζονται τουλάχιστον 2 μετρήσεις.</p>';
 const pts=list.slice().sort((a,b)=>a.t<b.t?-1:1),W=340,H=200,L=30,R=8,T=8,B=22;
 const t0=+new Date(pts[0].t),t1=+new Date(pts[pts.length-1].t),span=Math.max(t1-t0,1);
 const ymin=Math.floor(Math.min(50,...pts.map(r=>r.dia-10))/10)*10,ymax=Math.ceil(Math.max(170,...pts.map(r=>r.sys+10))/10)*10;
 const x=t=>L+(t-t0)/span*(W-L-R),y=v=>T+(ymax-v)/(ymax-ymin)*(H-T-B);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Γράφημα πίεσης">`;
 for(let v=ymin;v<=ymax;v+=20)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
 [135,85].forEach(v=>s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--mut)" stroke-dasharray="4 4"/>`);
 [['sys','var(--red)'],['dia','var(--blue)']].forEach(([f,c])=>{
  s+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map(r=>x(+new Date(r.t)).toFixed(1)+','+y(r[f]).toFixed(1)).join(' ')}"/>`;
  if(pts.length<=60)pts.forEach(r=>s+=`<circle cx="${x(+new Date(r.t)).toFixed(1)}" cy="${y(r[f]).toFixed(1)}" r="2.6" fill="${c}"/>`)});
 const d0=new Date(t0),d1=new Date(t1);
 s+=`<text x="${L}" y="${H-5}">${pad(d0.getDate())}/${pad(d0.getMonth()+1)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${pad(d1.getDate())}/${pad(d1.getMonth()+1)}</text></svg>`;
 return s;
}

function cardText(){

function markDose(k,s){
 const [,id]=k.split('|'),m=D.meds.find(x=>x.id===id);
 D.doses[k]={s,at:hm(new Date())};
 if(s==='taken'&&m&&m.stock!==''&&m.stock!=null){m.stock=Math.max(0,+m.stock-(+m.perDose||1))}
 save();render();toast(s==='taken'?'✓ Καταγράφηκε':'Καταγράφηκε ως παράλειψη');
}
function undoDose(k){
 const r=D.doses[k],[,id]=k.split('|'),m=D.meds.find(x=>x.id===id);
 if(r&&r.s==='taken'&&m&&m.stock!==''&&m.stock!=null)m.stock=+m.stock+(+m.perDose||1);
 delete D.doses[k];save();render();
}

let swReg=null;
async function notif(title,body,tag,actions){
 if(!('Notification' in window)||Notification.permission!=='granted')return false;
 try{const o={body,tag,icon:'icon-192.png',badge:'icon-192.png',requireInteraction:true,renotify:true,vibrate:[300,150,300],data:{tag}};
  if(actions)o.actions=actions;
  if(swReg)await swReg.showNotification(title,o);else new Notification(title,o);return true}catch(e){try{new Notification(title,{body,tag});return true}catch(_){return false}}
}
function beep(){if(!D.settings.sound)return;try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.28);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.3)})}catch(e){}}
function checkReminders(){
 const now=new Date(),nm=now.getHours()*60+now.getMinutes();let ch=false;
 dueList(now).forEach(i=>{const [a,b]=i.time.split(':').map(Number),t=a*60+b,k=doseKey(now,i.med,i.time);
  if(nm>=t&&nm-t<=180&&!D.doses[k]&&!D.notified[k]){D.notified[k]=1;ch=true;
   notif('💊 Ώρα για '+i.med.name,[i.med.strength,i.med.dose,FOOD[i.med.food]].filter(Boolean).join(' · ')+' ('+i.time+')',k,[{action:'take',title:'✓ Το πήρα'}]);beep()}});
 const td=dkey(now);
 D.appts.filter(a=>!a.done&&a.d===td).forEach(a=>{const k='appt|'+a.id;if(!D.notified[k]&&now.getHours()>=7){D.notified[k]=1;ch=true;notif('📅 Σήμερα: '+a.title,[a.h,a.place].filter(Boolean).join(' · '),k)}});
 // καθαρισμός παλιών
 const lim=dkey(new Date(Date.now()-3*864e5));Object.keys(D.notified).forEach(k=>{if(/^\d{4}-/.test(k)&&k.slice(0,10)<lim){delete D.notified[k];ch=true}});
 if(ch)persist();
 checkBanner();
}
function checkBanner(){
 const now=new Date(),nm=now.getHours()*60+now.getMinutes();
 const late=dueList(now).filter(i=>{const [a,b]=i.time.split(':').map(Number);return nm>=a*60+b&&!D.doses[doseKey(now,i.med,i.time)]});
 const bn=$('#banner');
 if(late.length&&TAB!=='sim'){bn.style.display='block';bn.textContent='💊 Εκκρεμεί: '+late.map(i=>i.med.name+' ('+i.time+')').join(', ')+' — πατήστε για «Σήμερα»';bn.onclick=()=>showTab('sim')}
 else bn.style.display='none';
}

/* ---------- Ημερολόγιο κινητού ---------- */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function makeIcs(){
 const meds=D.meds.filter(m=>m.active&&!m.prn&&(m.times||[]).length);
 if(!meds.length){alert('Δεν υπάρχουν ενεργά φάρμακα με ώρες.');return}
 const now=new Date(),st=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+'00Z';
 const BD=['SU','MO','TU','WE','TH','FR','SA'];
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//fakelos-ygeias//el','CALSCALE:GREGORIAN','X-WR-CALNAME:Φάρμακα'];
 meds.forEach(m=>{
  const sd=m.start&&m.start>dkey(now)?fromKey(m.start):now;
  m.times.forEach(t=>{const [h,mi]=t.split(':');
   let rr='RRULE:FREQ='+(m.days&&m.days.length&&m.days.length<7?'WEEKLY;BYDAY='+m.days.map(d=>BD[d]).join(','):'DAILY');
   if(m.until)rr+=';UNTIL='+m.until.replace(/-/g,'')+'T235959';
   const txt='💊 '+m.name+(m.strength?' '+m.strength:'')+(m.dose?' — '+m.dose:'');
   L.push('BEGIN:VEVENT','UID:'+m.id+'-'+t.replace(':','')+'@fakelos-ygeias','DTSTAMP:'+st,
    'DTSTART:'+sd.getFullYear()+pad(sd.getMonth()+1)+pad(sd.getDate())+'T'+h+mi+'00','DURATION:PT5M',rr,
    'SUMMARY:'+icsEsc(txt),'DESCRIPTION:'+icsEsc([m.purpose?'Για: '+m.purpose:'',FOOD[m.food]].filter(Boolean).join('\n')),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(txt),'TRIGGER:PT0M','END:VALARM','END:VEVENT')})});
 L.push('END:VCALENDAR');
 download('ypenthymiseis-farmakon.ics',L.join('\r\n'),'text/calendar');
 toast('Ανοίξτε το αρχείο για να μπει στο ημερολόγιο');
}
function download(name,text,type){const b=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

 let h=`<h2>Καταγραφή αρτηριακής πίεσης</h2><div>${esc(p.name||'')}${p.birth?' · Γέννηση: '+fmtS(fromKey(p.birth)):''}</div><div>Διάστημα: ${P?'τελευταίες '+P+' ημέρες':'όλες οι μετρήσεις'} · Εκτύπωση: ${fmtS(new Date())}</div>
 <h3>Σύνοψη</h3><div>Μέσος όρος: <b>${st.sys}/${st.dia}</b>${st.pulse?', σφυγμοί '+st.pulse:''} · ${st.n} μετρήσεις · πάνω από 135/85: ${st.high}</div>
 <table><tr><th>Ζώνη</th><th>Μετρήσεις</th><th>Μέσος όρος</th><th>Σφυγμοί</th></tr>${ZONES.map(z=>{const zl=list.filter(r=>zoneOf(new Date(r.t))===z),s=bpStats(zl);return `<tr><td>${z.n} (${z.l})</td><td>${zl.length}</td><td>${s?s.sys+'/'+s.dia:'—'}</td><td>${s&&s.pulse?s.pulse:'—'}</td></tr>`}).join('')}</table>
 <h3>Ενεργά φάρμακα</h3><div>${D.meds.filter(m=>m.active).map(m=>esc(m.name+' '+(m.strength||'')+' — '+(m.dose||'')+' — '+freqText(m))).join('<br>')||'—'}</div>
 <h3>Μετρήσεις</h3><table><tr><th>Ημερομηνία</th><th>Ώρα</th><th>Πίεση</th><th>Σφυγμοί</th><th>Σημειώσεις</th></tr>${list.map(r=>{const d=new Date(r.t);return `<tr><td>${fmtS(d)}</td><td>${hm(d)}</td><td><b>${r.sys}/${r.dia}</b></td><td>${r.pulse||''}</td><td>${esc([(r.sym||[]).join(', '),r.note].filter(Boolean).join(' · '))}</td></tr>`}).join('')}</table>`;
 doPrint(h);
}

/* ---------- Αντίγραφα ασφαλείας (κοινός φάκελος) ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('shared-backups',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('handles'))r.result.createObjectStore('handles')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDo(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('handles',mode),rq=fn(tx.objectStore('handles'));rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)})}
const getRoot=()=>idbDo('readonly',s=>s.get('root')).catch(()=>null);
const setRoot=h=>idbDo('readwrite',s=>s.put(h,'root'));
const delRoot=()=>idbDo('readwrite',s=>s.delete('root'));
async function pickRoot(){const h=await window.showDirectoryPicker({id:'backups',mode:'readwrite',startIn:'downloads'});await setRoot(h);return h}
async function perm(h,ask){const o={mode:'readwrite'};try{if(await h.queryPermission(o)==='granted')return true;if(ask)return(await h.requestPermission(o))==='granted'}catch(e){}return false}
const bkName=()=>'fakelos-ygeias-'+dkey(new Date())+'.json';
async function backupNow(ask){
 const data=JSON.stringify(D);
 let root=await getRoot();
 if(!root&&ask&&window.showDirectoryPicker){try{root=await pickRoot()}catch(e){root=null}}
 if(root&&await perm(root,ask)){
  try{const dir=await root.getDirectoryHandle(SUB,{create:true}),fh=await dir.getFileHandle(bkName(),{create:true}),w=await fh.createWritable();await w.write(data);await w.close();
   D.settings.lastBackup=new Date().toISOString();persist();return 'folder'}catch(e){if(!ask)return null}
 }
 if(ask){download(bkName(),data,'application/json');D.settings.lastBackup=new Date().toISOString();persist();return 'download'}
 return null;
}
let bkT=null;function schedBackup(){clearTimeout(bkT);bkT=setTimeout(()=>backupNow(false),4000)}
async function bkInfo(){
 const e=$('#bkinfo');if(!e)return;const root=await getRoot();
 const lb=D.settings.lastBackup?new Date(D.settings.lastBackup):null;
 e.innerHTML=(root?`Φάκελος: <b>${esc(root.name)}/${SUB}</b>`:(window.showDirectoryPicker?'Δεν έχει επιλεγεί φάκελος — με το «Αντίγραφο τώρα» διαλέγετε τον κοινό φάκελο αντιγράφων.':'Η συσκευή δεν υποστηρίζει φάκελο· το αντίγραφο κατεβαίνει ως αρχείο.'))+(lb?`<br>Τελευταίο αντίγραφο: ${fmtS(lb)} ${hm(lb)}`:'<br>Δεν έχει γίνει αντίγραφο ακόμη.')+(root?'<br>Όταν υπάρχει άδεια, γίνεται αυτόματα μετά από κάθε αλλαγή.':'');
}
async function restoreList(){
 const root=await getRoot();
 if(!root||!(await perm(root,true))){$('#fileIn').click();return}
 let files=[];
 try{const dir=await root.getDirectoryHandle(SUB,{create:true});for await(const [n,h] of dir.entries()){if(h.kind==='file'&&n.endsWith('.json'))files.push({n,h})}}catch(e){}
 files.sort((a,b)=>a.n<b.n?1:-1);files=files.slice(0,10);
 openDlg(`<h2>Επαναφορά από αντίγραφο</h2>${files.length?files.map((f,i)=>`<button type="button" class="wide" style="margin-bottom:6px;text-align:left" data-act="restorefile" data-i="${i}">${esc(f.n)} ${i===0?'<span class="tag">νεότερο</span>':''}</button>`).join(''):'<p class="mut">Δεν βρέθηκαν αντίγραφα στον φάκελο.</p>'}
 <button type="button" class="wide" data-act="restorepick">Επιλογή αρχείου από αλλού…</button><div class="acts"><button type="button" data-act="close">Άκυρο</button></div>`,()=>{});
 window._rfiles=files;
}
function applyRestore(text){
 try{const x=JSON.parse(text);if(!x||typeof x!=='object'||!('meds' in x||'bp' in x))throw 0;
  if(!confirm('Τα τωρινά δεδομένα θα αντικατασταθούν από το αντίγραφο. Συνέχεια;'))return;
  D=fix(x);persist();$('#dlg').open&&$('#dlg').close();render();toast('Έγινε επαναφορά')}catch(e){alert('Το αρχείο δεν είναι έγκυρο αντίγραφο αυτής της εφαρμογής.')}
}

/* ---------- Τεχνητή νοημοσύνη (OpenRouter, δωρεάν μοντέλα) ---------- */
const KKEY='fakelosYgeias_orkey';
function getKey(){try{let k=localStorage.getItem(KKEY);if(k)return k;
 // ίδιο κλειδί με άλλες εφαρμογές του ίδιου ιστότοπου (π.χ. Identify-AI)
 for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i),v=localStorage.getItem(n)||'';const mt=v.match(/sk-or-v1-[A-Za-z0-9]{20,}/);if(mt){localStorage.setItem(KKEY,mt[0]);return mt[0]}}}catch(e){}return ''}
function setKey(k){try{k?localStorage.setItem(KKEY,k):localStorage.removeItem(KKEY)}catch(e){}}
function askKey(){if(confirm('Για την αναγνώριση χρειάζεται δωρεάν κλειδί OpenRouter (χωρίς κάρτα).\nΝα πάτε στις ρυθμίσεις για να το βάλετε;')){$('#dlg').close();showTab('per');setTimeout(()=>{const e=$('#orkey');e&&e.scrollIntoView({block:'center'});e&&e.focus()},100)}}
async function freeModels(force){
 const c=D.settings.aiModels;
 if(!force&&c&&c.t>Date.now()-864e5&&c.list.length)return c.list;
 const r=await fetch('https://openrouter.ai/api/v1/models');if(!r.ok)throw new Error('Δεν βρέθηκε λίστα μοντέλων');
 const j=await r.json();
 const list=(j.data||[]).filter(m=>{const a=m.architecture||{},p=m.pricing||{};return (a.input_modalities||[]).includes('image')&&(a.output_modalities||['text']).includes('text')&&+p.prompt===0&&+(p.completion||0)===0&&!/stealth|alpha/i.test(m.id)})
  .sort((a,b)=>(b.context_length||0)-(a.context_length||0)).map(m=>m.id);
 if(!list.length)throw new Error('Αυτή τη στιγμή δεν υπάρχουν δωρεάν μοντέλα με εικόνα');
 D.settings.aiModels={t:Date.now(),list};persist();return list;
}
async function aiCall(content,models){
 let last='';
 for(const model of models){
  try{
   const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+getKey(),'Content-Type':'application/json','X-Title':'Fakelos Ygeias'},
    body:JSON.stringify({model,messages:[{role:'user',content}],temperature:0.2,max_tokens:1500})});
   const j=await r.json().catch(()=>({}));
   if(r.status===401)throw Object.assign(new Error('Το κλειδί δεν είναι σωστό'),{fatal:true});
   if(!r.ok||j.error){last=(j.error&&j.error.message)||('σφάλμα '+r.status);continue}
   const txt=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
   const t=Array.isArray(txt)?txt.map(x=>x.text||'').join(''):txt;
   const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a){last='ακατάλληλη απάντηση';continue}
   return JSON.parse(t.slice(a,b+1));
  }catch(e){if(e.fatal)throw e;last=e.message}
 }
 throw new Error('Δεν απάντησε κανένα δωρεάν μοντέλο ('+last+'). Δοκιμάστε ξανά σε λίγο.');
}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const M=1400,k=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.85))};img.onerror=()=>rej(new Error('Η φωτογραφία δεν διαβάστηκε'));img.src=u})}
const AI_PROMPT=`Είσαι βοηθός φαρμακοποιού. ΣΤΟΧΟΣ: αναγνώρισε το φάρμακο ΚΑΙ δώσε πληροφορίες στα ελληνικά, απλά για ασθενή.
Απάντησε ΜΟΝΟ με ένα αντικείμενο JSON, χωρίς άλλο κείμενο, με τα πεδία:
{"name":"εμπορική ονομασία όπως γράφει στο κουτί","strength":"περιεκτικότητα π.χ. 5 mg","form":"ένα από: ${FORMS.join(', ')}","substance":"δραστική ουσία","purpose":"τι κάνει και για ποιες παθήσεις δίνεται, 1-2 προτάσεις","food":"ένα από: prin, me, meta, nistis, adiaforo ή κενό αν δεν ξέρεις","sideEffects":"οι πιο συχνές παρενέργειες, σύντομα, χωρισμένες με κόμμα","warnings":"σημαντικές προφυλάξεις και αλληλεπιδράσεις (π.χ. αλκοόλ, άλλα φάρμακα), σύντομα","confidence":"υψηλή, μέτρια ή χαμηλή"}
Αν δεν μπορείς να το αναγνωρίσεις, βάλε "name":"" και "confidence":"χαμηλή". Μην επινοείς ονομασίες.`;
async function aiRun(file,name){
 const st=$('#aistat'),btns=document.querySelectorAll('[data-act=aiphoto],[data-act=ainame]');
 const set=t=>{if(st)st.innerHTML=t};btns.forEach(b=>b.disabled=true);
 try{
  set('⏳ Ετοιμασία…');const content=[{type:'text',text:AI_PROMPT+(name?'\nΤο φάρμακο είναι: '+name:'\nΔες τη φωτογραφία της συσκευασίας.')}];
  if(file){const url=await shrink(file);content.push({type:'image_url',image_url:{url}})}
  const models=await freeModels(false);
  set('⏳ Η τεχνητή νοημοσύνη αναζητά το φάρμακο…');
  let r;try{r=await aiCall(content,models.slice(0,6))}catch(e){if(e.fatal)throw e;r=await aiCall(content,(await freeModels(true)).slice(0,6))}
  if(!r||(!r.name&&!r.substance)){set('✕ Δεν αναγνωρίστηκε. Τραβήξτε πιο καθαρά την πλευρά με το όνομα, με καλό φως.');return}
  const f=$('#dform');if(!f)return;
  const put=(n,v)=>{if(v&&f.elements[n])f.elements[n].value=String(v).trim()};
  put('name',r.name||name);put('strength',r.strength);put('substance',r.substance);put('purpose',r.purpose);put('sideEffects',r.sideEffects);put('warnings',r.warnings);
  if(r.form&&FORMS.includes(r.form))f.elements.form.value=r.form;
  if(r.food&&FOOD[r.food]!==undefined&&r.food)f.elements.food.value=r.food;
  f.elements.ai.value='1';
  set(`✓ Συμπληρώθηκε${r.confidence?' (βεβαιότητα: '+esc(r.confidence)+')':''}. <b>Ελέγξτε τα στοιχεία</b> και βάλτε ώρες και δόση όπως σας τα έγραψε ο γιατρός.`);
 }catch(e){set('✕ '+esc(e.message))}
 finally{btns.forEach(b=>b.disabled=false)}
}
$('#camIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)aiRun(f,($('#dform [name=name]')||{}).value||'')});

/* ---------- Χειρισμός κλικ ---------- */
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(TAB==='per')render()});
document.addEventListener('click',async e=>{
 const nb=e.target.closest('nav button');if(nb){showTab(nb.dataset.tab);return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,id=b.dataset.id,med=id&&D.meds.find(m=>m.id===id);
 switch(a){
  case 'close':$('#dlg').close();break;
  case 'addbp':bpForm();break;
  case 'editbp':bpForm(D.bp.find(r=>r.id===id));break;
  case 'delbp':if(confirm('Διαγραφή της μέτρησης;')){D.bp=D.bp.filter(r=>r.id!==id);save();$('#dlg').close();render()}break;
  case 'period':D.settings.period=+b.dataset.v;persist();render();break;
  case 'printbp':printBp();break;
  case 'addmed':medForm();break;
  case 'aiphoto':if(!getKey()){askKey();break}$('#camIn').click();break;
  case 'ainame':{const nm=$('#dform [name=name]').value.trim();if(!nm){alert('Γράψτε πρώτα το όνομα του φαρμάκου.');break}if(!getKey()){askKey();break}aiRun(null,nm);break}
  case 'savekey':setKey($('#orkey').value.trim());$('#keystat').textContent=getKey()?'✓ Αποθηκεύτηκε':'Το κλειδί σβήστηκε';break;
  case 'testkey':{setKey($('#orkey').value.trim());const st=$('#keystat');st.textContent='Έλεγχος…';try{const ms=await freeModels(true);await aiCall([{type:'text',text:'Απάντησε μόνο: {"ok":true}'}],ms.slice(0,4));st.textContent='✓ Λειτουργεί ('+ms.length+' δωρεάν μοντέλα με εικόνα)'}catch(e){st.textContent='✕ '+e.message}break}
  case 'editmed':medForm(med);break;
  case 'delmed':if(confirm('Οριστική διαγραφή του φαρμάκου και του ιστορικού του;\nΑν απλώς σταματήσατε να το παίρνετε, προτιμήστε «Διακοπή».')){D.meds=D.meds.filter(m=>m.id!==id);save();$('#dlg').close();render()}break;
  case 'stopmed':stopForm(med);break;
  case 'restartmed':med.active=true;med.end='';med.endReason='';med.start=dkey(new Date());addHist(med,'Επανέναρξη');save();render();toast('Το φάρμακο είναι ξανά ενεργό');break;
  case 'histmed':histDlg(med);break;
  case 'medview':D.settings.medview=b.dataset.v;persist();render();break;
  case 'addtime':$('#times').insertAdjacentHTML('beforeend',timeRow(''));break;
  case 'deltime':if(document.querySelectorAll('#times .row').length>1)b.parentElement.remove();else b.previousElementSibling.value='';break;
  case 'prntoggle':$('#schedBox').style.display=b.checked?'none':'';break;
  case 'alldays':$('#daysBox').style.display=b.checked?'none':'';break;
  case 'take':markDose(b.dataset.k,'taken');break;
  case 'skip':markDose(b.dataset.k,'skipped');break;
  case 'undo':undoDose(b.dataset.k);break;
  case 'prn':{const m=D.meds.find(x=>x.id===b.dataset.id);if(!m)break;const k=dkey(new Date())+'|'+m.id+'|prn|'+Date.now();markDose(k,'taken');break}
  case 'profile':profileForm();break;
  case 'addappt':apptForm();break;
  case 'editappt':apptForm(D.appts.find(x=>x.id===id));break;
  case 'delappt':if(confirm('Διαγραφή;')){D.appts=D.appts.filter(x=>x.id!==id);save();$('#dlg').close();render()}break;
  case 'bigtext':D.settings.bigtext=!D.settings.bigtext;persist();render();break;
  case 'sharecard':{const t=cardText();if(navigator.share){try{await navigator.share({title:'Κάρτα υγείας',text:t})}catch(e){}}else{await copy(t)}break}
  case 'copycard':await copy(cardText());break;
  case 'printcard':doPrint('<div class="hcard">'+$('#t-kar .hcard').innerHTML+'</div>');break;
  case 'notifon':if('Notification' in window){const r=await Notification.requestPermission();toast(r==='granted'?'Οι ειδοποιήσεις ενεργοποιήθηκαν':'Οι ειδοποιήσεις δεν επιτράπηκαν');render()}break;
  case 'testnotif':{const ok=await notif('💊 Δοκιμή','Έτσι θα φαίνονται οι υπενθυμίσεις.','test');beep();if(!ok)toast('Ενεργοποιήστε πρώτα τις ειδοποιήσεις');break}
  case 'sound':D.settings.sound=b.checked;persist();break;
  case 'ics':makeIcs();break;
  case 'backup':{const r=await backupNow(true);toast(r==='folder'?'Το αντίγραφο αποθηκεύτηκε στον φάκελο':r==='download'?'Το αντίγραφο κατέβηκε ως αρχείο':'Δεν έγινε αντίγραφο');bkInfo();break}
  case 'clearfolder':await delRoot().catch(()=>{});toast('Ο φάκελος ξεχάστηκε· τα αρχεία δεν σβήστηκαν');bkInfo();break;
  case 'restorelist':restoreList();break;
  case 'restorefile':{const f=(window._rfiles||[])[+b.dataset.i];if(f){const file=await f.h.getFile();applyRestore(await file.text())}break}
  case 'restorepick':$('#fileIn').click();break;
  case 'install':if(installEvt){installEvt.prompt();installEvt=null;render()}break;
  case 'wipe':if(confirm('Να σβηστούν ΟΛΑ τα δεδομένα από αυτή τη συσκευή;')&&confirm('Σίγουρα; Δεν αναιρείται (εκτός αν έχετε αντίγραφο).')){localStorage.removeItem(KEY);D=fix({});render();toast('Διαγράφηκαν')}break;
 }
});
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Αντιγράφηκε')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Αντιγράφηκε')}}
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];if(f)applyRestore(await f.text());e.target.value=''});

/* ---------- Εκκίνηση ---------- */
function handleTake(tag){if(tag&&/^\d{4}-\d\d-\d\d\|/.test(tag)&&!D.doses[tag])markDose(tag,'taken')}
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
 navigator.serviceWorker.ready.then(r=>swReg=r).catch(()=>{});
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.take)handleTake(e.data.take)});
}
const qp=new URLSearchParams(location.search);
if(qp.get('take')){handleTake(qp.get('take'));history.replaceState(null,'',location.pathname)}
render();
checkReminders();
setInterval(checkReminders,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();render()}});
</script>
